<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HearLink - Contact</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #2c3e50; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    textarea { height: 120px; resize: vertical; }
    button { background: #2c3e50; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #34495e; }
    .success-message { display: none; background: #d4edda; color: #155724; padding: 12px; border-radius: 4px; margin-top: 16px; }
    .error-message { display: none; background: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; margin-top: 16px; }
    .char-count { font-size: 12px; color: #888; text-align: right; }
  </style>
</head>
<body>

  <h1>Contact Us</h1>
  <p>Fill in the form below and a member of the HearLink team will get back to you within 2 working days.</p>

  <form id="contactForm" novalidate>

    <div class="form-group">
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" name="fullName" placeholder="Jane Smith" required />
    </div>

    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" placeholder="jane@example.com" required />
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="07700 900000" />
    </div>

    <div class="form-group">
      <label for="enquiryType">Enquiry Type *</label>
      <select id="enquiryType" name="enquiryType" required>
        <option value="">Select an option</option>
        <option value="appointment">Book an Appointment</option>
        <option value="hearing_aid">Hearing Aid Support</option>
        <option value="billing">Billing Enquiry</option>
        <option value="general">General Enquiry</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message" name="message" placeholder="Please describe your enquiry..." required maxlength="500"></textarea>
      <div class="char-count"><span id="charCount">0</span>/500</div>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="consentCheckbox" name="consent" required />
        I consent to HearLink storing my details to respond to this enquiry.
      </label>
    </div>

    <button type="submit" id="submitBtn">Send Message</button>

    <div class="success-message" id="successMsg">
      ✅ Thank you! Your message has been sent. We'll be in touch within 2 working days.
    </div>
    <div class="error-message" id="errorMsg">
      ❌ Something went wrong. Please try again or call us directly.
    </div>

  </form>

  <script src="contact-form.js"></script>
</body>
</html>
